# DO-NOT-EDIT. Generated by docs/modules/issues.nix (the issue evaluator). Regenerate: cd docs && nix run .#write-files
"jobs":
  "evaluate":
    "if": "contains(github.event.issue.body, '```nix')"
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "persist-credentials": false
      -
        "uses": "cachix/install-nix-action@v31"
      -
        "env":
          "ISSUE_BODY": "${{ github.event.issue.body }}"
        "name": "evaluate the nix blocks as one fleet (pure, restricted, no token)"
        "run": "nix develop ./docs -c issue-eval - \"$RUNNER_TEMP/issue\""
      -
        "env":
          "GH_REPO": "${{ github.repository }}"
          "GH_TOKEN": "${{ github.token }}"
          "NUMBER": "${{ github.event.issue.number }}"
        "name": "comment"
        "run": "nix develop ./docs -c issue-comment \"$NUMBER\" \"$RUNNER_TEMP/issue/comment.md\""
    "timeout-minutes": 10
"name": "issue"
"on":
  "issues":
    "types":
      - "opened"
      - "edited"
"permissions":
  "contents": "read"
  "issues": "write"
