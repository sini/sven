    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "env":
          "ATTR": "homeConfigurations.\"alice-laptop\".activationPackage"
        "name": "evaluate alice-laptop"
        "run": |
          drv=$(nix eval --raw "$FLEET#$ATTR.drvPath")
          echo "$drv"
          case "$drv" in /nix/store/*.drv) ;; *) exit 1 ;; esac
      -
        "env":
          "ATTR": "homeConfigurations.\"alice@stage\".activationPackage"
        "name": "evaluate alice@stage"
        "run": |
          drv=$(nix eval --raw "$FLEET#$ATTR.drvPath")
          echo "$drv"
          case "$drv" in /nix/store/*.drv) ;; *) exit 1 ;; esac
      -
        "env":
          "ATTR": "nixosConfigurations.app-1.config.system.build.toplevel"
        "name": "evaluate app-1"
        "run": |
          drv=$(nix eval --raw "$FLEET#$ATTR.drvPath")
          echo "$drv"
          case "$drv" in /nix/store/*.drv) ;; *) exit 1 ;; esac
      -
        "env":
          "ATTR": "nixosConfigurations.app-2.config.system.build.toplevel"
        "name": "evaluate app-2"
        "run": |
          drv=$(nix eval --raw "$FLEET#$ATTR.drvPath")
          echo "$drv"
          case "$drv" in /nix/store/*.drv) ;; *) exit 1 ;; esac
      -
        "env":
          "ATTR": "nixosConfigurations.app-3.config.system.build.toplevel"
        "name": "evaluate app-3"
        "run": |
          drv=$(nix eval --raw "$FLEET#$ATTR.drvPath")
          echo "$drv"
          case "$drv" in /nix/store/*.drv) ;; *) exit 1 ;; esac
      -
        "env":
          "ATTR": "nixosConfigurations.app-4.config.system.build.toplevel"
        "name": "evaluate app-4"
        "run": |
          drv=$(nix eval --raw "$FLEET#$ATTR.drvPath")
          echo "$drv"
          case "$drv" in /nix/store/*.drv) ;; *) exit 1 ;; esac
      -
        "env":
          "ATTR": "devShells.x86_64-linux.default"
        "name": "evaluate devshell-x86_64-linux"
        "run": |
          drv=$(nix eval --raw "$FLEET#$ATTR.drvPath")
          echo "$drv"
          case "$drv" in /nix/store/*.drv) ;; *) exit 1 ;; esac
      -
        "env":
          "ATTR": "nixosConfigurations.lb.config.system.build.toplevel"
        "name": "evaluate lb"
        "run": |
          drv=$(nix eval --raw "$FLEET#$ATTR.drvPath")
          echo "$drv"
          case "$drv" in /nix/store/*.drv) ;; *) exit 1 ;; esac
      -
        "env":
          "ATTR": "nixosConfigurations.stage.config.system.build.toplevel"
        "name": "evaluate stage"
        "run": |
          drv=$(nix eval --raw "$FLEET#$ATTR.drvPath")
          echo "$drv"
          case "$drv" in /nix/store/*.drv) ;; *) exit 1 ;; esac
      -
        "env":
          "ATTR": "nixosConfigurations.web-1.config.system.build.toplevel"
        "name": "evaluate web-1"
        "run": |
          drv=$(nix eval --raw "$FLEET#$ATTR.drvPath")
          echo "$drv"
          case "$drv" in /nix/store/*.drv) ;; *) exit 1 ;; esac
      -
        "env":
          "ATTR": "nixosConfigurations.web-2.config.system.build.toplevel"
        "name": "evaluate web-2"
        "run": |
          drv=$(nix eval --raw "$FLEET#$ATTR.drvPath")
          echo "$drv"
          case "$drv" in /nix/store/*.drv) ;; *) exit 1 ;; esac
    "timeout-minutes": 30
  "flake-check":
    "needs":
      - "fleet"
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "name": "enable KVM (the VM test)"
        "run": |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      -
        "uses": "actions/checkout@v4"
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "extra_nix_config": "system-features = nixos-test benchmark big-parallel kvm"
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "nix flake check"
        "run": "nix flake check -L \"$FLEET\""
    "timeout-minutes": 120
  "fleet":
    "needs":
      - "docs"
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "fleet checks"
        "run": |
          out=$(nix eval --impure --file tests.nix failed)
          echo "failed = $out"
          test "$out" = "[ ]"
        "working-directory": "templates/fleet"
      -
        "name": "real evaluations (e2e)"
        "run": |
          out=$(nix eval --impure --file tests.nix e2e.failed)
          echo "e2e.failed = $out"
          test "$out" = "[ ]"
        "working-directory": "templates/fleet"
      -
        "name": "trimmed module lists cost oracle"
        "run": "bash cost.sh"
        "working-directory": "templates/fleet"
      -
        "name": "MCP server and flake app"
        "run": "bash mcp/test.sh"
        "working-directory": "templates/fleet"
    "timeout-minutes": 120
  "fmt":
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "every nix file is formatted (nixfmt)"
        "run": "git ls-files -z '*.nix' | xargs -0 nix run nixpkgs#nixfmt-rfc-style -- --check"
      -
        "name": "the generated workflows are valid (actionlint)"
        "run": "nix run nixpkgs#actionlint -- .github/workflows/*.yml"
    "timeout-minutes": 30
"name": "test"
"on":
  "pull_request": {}
  "push": {}
  "workflow_dispatch": {}
"permissions":
  "contents": "read"
