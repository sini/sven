# DO-NOT-EDIT. Generated by docs/modules/ci.nix (the docs fleet). Regenerate: cd docs && nix run .#write-files
# Jobs: docs, engine, eval-aarch64-darwin, eval-aarch64-linux, eval-x86_64-linux, flake-check, fleet, fmt
"concurrency":
  "cancel-in-progress": true
  "group": "${{ github.workflow }}-${{ github.ref }}"
"env":
  "FLEET": "path:${{ github.workspace }}?dir=templates/fleet"
"jobs":
  "docs":
    "needs":
      - "engine"
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "docs examples"
        "run": |
          out=$(nix eval --impure --file tests.nix failed)
          echo "failed = $out"
          test "$out" = "[ ]"
        "working-directory": "docs"
      -
        "name": "docs flake check: pages and this workflow current, examples, e2e"
        "run": "nix flake check -L \"git+file://${{ github.workspace }}?dir=docs\""
      -
        "name": "site build"
        "run": "nix shell nixpkgs#nodejs nixpkgs#pnpm -c sh -c 'pnpm install --frozen-lockfile && pnpm build'"
        "working-directory": "docs"
    "timeout-minutes": 60
  "engine":
    "needs":
      - "fmt"
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "engine and library oracles"
        "run": |
          out=$(nix-instantiate --eval --strict tests -A failed)
          echo "failed = $out"
          test "$out" = "[ ]"
      -
        "name": "cost oracles (memos)"
        "run": "bash tests/cost.sh"
    "timeout-minutes": 20
  "eval-aarch64-darwin":
    "needs":
      - "fleet"
    "runs-on": "macos-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "env":
          "ATTR": "devShells.aarch64-darwin.default"
        "name": "evaluate devshell-aarch64-darwin"
        "run": |
          drv=$(nix eval --raw "$FLEET#$ATTR.drvPath")
          echo "$drv"
          case "$drv" in /nix/store/*.drv) ;; *) exit 1 ;; esac
      -
        "env":
          "ATTR": "darwinConfigurations.studio.config.system.build.toplevel"
        "name": "evaluate studio"
        "run": |
          drv=$(nix eval --raw "$FLEET#$ATTR.drvPath")
          echo "$drv"
          case "$drv" in /nix/store/*.drv) ;; *) exit 1 ;; esac
    "timeout-minutes": 30
  "eval-aarch64-linux":
    "needs":
      - "fleet"
    "runs-on": "ubuntu-24.04-arm"
    "steps":
      -
        "uses": "actions/checkout@v4"
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "env":
          "ATTR": "devShells.aarch64-linux.default"
        "name": "evaluate devshell-aarch64-linux"
        "run": |
          drv=$(nix eval --raw "$FLEET#$ATTR.drvPath")
          echo "$drv"
          case "$drv" in /nix/store/*.drv) ;; *) exit 1 ;; esac
    "timeout-minutes": 30
  "eval-x86_64-linux":
