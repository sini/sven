# DO-NOT-EDIT. Generated by docs/modules/ci.nix (the docs fleet). Regenerate: cd docs && nix run .#write-files
"concurrency":
  "cancel-in-progress": true
  "group": "pages"
"jobs":
  "deploy":
    "environment":
      "name": "github-pages"
      "url": "${{ steps.deployment.outputs.page_url }}"
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "fetch-depth": 0
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "build the site"
        "run": "nix develop ./docs -c docs-build"
      -
        "uses": "actions/configure-pages@v5"
      -
        "uses": "actions/upload-pages-artifact@v3"
        "with":
          "path": "./docs/dist"
      -
        "id": "deployment"
        "uses": "actions/deploy-pages@v4"
    "timeout-minutes": 30
"name": "GH Pages"
"on":
  "push":
    "branches":
      - "main"
    "paths":
      - "docs/**"
  "workflow_dispatch": {}
"permissions":
  "contents": "read"
  "id-token": "write"
  "pages": "write"
